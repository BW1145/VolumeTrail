[package]
name = "volumetrail"
version = "0.3.1-dev"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
ntfs = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "backup", "hooks", "functions"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Performance", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_TaskScheduler", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[features]
ui-capture = ["dep:image"]

[[example]]
name = "ui_capture"
required-features = ["ui-capture"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
